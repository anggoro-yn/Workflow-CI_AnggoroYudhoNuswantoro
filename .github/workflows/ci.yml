name: Retrain Model CI

on:
  push:
    branches: [ main ]

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install mlflow pandas scikit-learn

      - name: Run MLflow Project
        run: |
          # Ganti nama eksperimen menjadi Dry_Bean_Retraining
          mlflow run . --env-manager local --experiment-name "Dry_Bean_Retraining"
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: mlruns/
